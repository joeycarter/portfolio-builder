[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-builder"
version = "0.1.0"
description = "A terminal portfolio builder and rebalancer for CAD and USD securities"
requires-python = ">=3.11"
dependencies = ["windows-curses>=2.4; sys_platform == 'win32'"]

[project.optional-dependencies]
quotes = ["yfinance>=0.2.54,<1"]

[project.scripts]
portfolio-builder = "portfolio_builder.__main__:main"

[tool.setuptools.packages.find]
include = ["portfolio_builder*"]
